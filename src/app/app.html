<mat-toolbar color="primary">
  <mat-toolbar-row>
    <button mat-button (click)="toggleSidenav()"><mat-icon>menu</mat-icon></button>
    <button mat-button routerLink="/home" (click)="opened = false"><mat-icon>home</mat-icon>Home</button>
    <button mat-button class="right" (click)="login()">
      <mat-icon>account_circle</mat-icon>
      {{ authService.loggedIn ? authService.currentUser?.username : 'Login' }}
    </button>
  </mat-toolbar-row></mat-toolbar>
<mat-sidenav-container>
  <mat-sidenav mode="side" [(opened)]="opened">
    <button mat-button><mat-icon>list</mat-icon><span mat-list-item routerLink="list">List of
        Assignments</span></button>
    @if(authService.currentUser?.role === 'admin') {
    <button mat-button><mat-icon>add</mat-icon><span mat-list-item routerLink="add">Add Assignments</span><br></button>
    <button mat-button><mat-icon>generate</mat-icon><span mat-list-item routerLink="/GenData">Generate test data
      </span><br></button>
    }
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
